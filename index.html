<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地铁司机模拟 · ATP 防护行车</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
    <div id="fps" class="fps"></div>
    <div id="help" class="help">
      <h3>操作说明</h3>
      <table>
        <tr><td><b>W / S</b></td><td>牵引升 / 降（4 级）</td></tr>
        <tr><td><b>D / A</b></td><td>制动升 / 降（7 级）</td></tr>
        <tr><td><b>R / N / F</b></td><td>反向器 前进 / 零位 / 后退</td></tr>
        <tr><td><b>空格</b></td><td>司机紧急制动按钮</td></tr>
        <tr><td><b>Q</b></td><td>EB 停稳后确认缓解</td></tr>
        <tr><td><b>E</b></td><td>关闭屏蔽门 / 车门</td></tr>
        <tr><td><b>X</b></td><td>过标后申请退行（限速 5 km/h）</td></tr>
        <tr><td><b>C</b></td><td>切换视角（追尾 / 驾驶室 / 环绕）</td></tr>
      </table>
      <p class="hint">停车标前后 30 cm 内停准，屏蔽门才会开启。</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
